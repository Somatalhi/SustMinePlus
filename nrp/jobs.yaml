---
apiVersion: batch/v1
kind: Job
metadata:
  name: sm-nsga2-s0-b5000
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            mkdir -p /work && cp -r /data/sustmine-search/. /work/ && rm -rf /work/results
            mkdir -p /data/sustmine-search/results && ln -s /data/sustmine-search/results /work/results
            cp /data/bench_phases.pkl /work/
            cd /work
            pip install -q -r requirements.txt
            python run_exp1_mip.py --algo nsga2 --seed 0 --budget 5000 --workers 16 --time_limit 60
        resources:
          requests: {cpu: "16", memory: "16Gi"}
          limits:   {cpu: "16", memory: "16Gi"}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: sustmine-data}
